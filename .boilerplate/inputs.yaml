# Module configuration

# databases: map of MySQL databases to create
# Each key is a db_ref used internally by the module.
databases: {}
#   app:
#     name: "appdb"                      # (Required) Database name
#     create: true                        # (Optional) Manage the database. Default: true
#     charset: "utf8mb4"                 # (Optional) Character set. Default: "utf8mb4"
#     collation: "utf8mb4_unicode_ci"    # (Optional) Collation. Default: "utf8mb4_unicode_ci"

# users: map of MySQL users to create
# Each key is a user_ref used internally by the module.
users: {}
#   app_owner:
#     name: "appowner"       # (Required) MySQL user name
#     host: "%"              # (Optional) Host restriction. Default: "%"
#     grant: "owner"         # (Required) Grant type: owner | readwrite | readonly
#     databases: ["appdb"]   # (Required) List of database names to grant access on
#     password: null          # (Optional, sensitive) Externally managed password. Default: generated
#     generate_password: false # (Optional) Generate a password here. Default: true when password is omitted. Forced off when auth_plugin delegates authentication (auth_socket, authentication_kerberos/ldap_*/pam/webauthn/windows, mysql_no_login, gssapi, named_pipe, pam, unix_socket, aad_auth, AWSAuthenticationPlugin) or when auth_string is set
#     tls_option: "NONE"      # (Optional) MySQL TLS requirement. Default: provider default
#     auth_plugin: "caching_sha2_password" # (Optional) Authentication plugin. One of: mysql_native_password | caching_sha2_password | sha256_password | aad_auth. Default: server default
#     auth_string: null       # (Optional, sensitive) Already-hashed authentication string for auth_plugin (e.g. "*2470C0C06DEE42FD1618BB99005ADCA2EC9D1E19"). Alias of auth_string_hashed. Default: null
#     auth_string_hashed: null # (Optional, sensitive) Already-hashed authentication string; used only when auth_string is absent. Default: null
#     aad_identity:           # (Optional) Azure AD identity block. Only sent when auth_plugin is "aad_auth"; ignored otherwise
#       type: "user"          # (Optional) Identity type: user | group | service_principal. Default: provider default
#       identity: "app@contoso.com" # (Required when auth_plugin is "aad_auth") Azure AD user/group name or service principal object ID
#     max_user_connections: 0 # (Optional) Max simultaneous connections for the user, 0 = unlimited. Default: server default
#     max_statement_time: 0   # (Optional) Max statement execution time in seconds, 0 = unlimited. MariaDB 10.1.1+ only, not MySQL. Default: server default
#     resource_group: "owner" # (Optional) Stable state group: owner | user. Default: derived from grant
#     manage_grants: true     # (Optional) Manage grants in this module. Default: true
#   app_reader:
#     name: "appreader"      # (Required) MySQL user name
#     host: "%"              # (Optional) Host restriction. Default: "%"
#     grant: "readonly"      # (Required) Grant type: owner | readwrite | readonly
#     databases: ["appdb"]   # (Required) List of database names to grant access on
#     password: null          # (Optional, sensitive) Externally managed password. Default: generated
#     generate_password: false # (Optional) Generate a password here. Default: true when password is omitted. Forced off when auth_plugin delegates authentication (auth_socket, authentication_kerberos/ldap_*/pam/webauthn/windows, mysql_no_login, gssapi, named_pipe, pam, unix_socket, aad_auth, AWSAuthenticationPlugin) or when auth_string is set
#     tls_option: "NONE"      # (Optional) MySQL TLS requirement. Default: provider default
#     auth_plugin: "caching_sha2_password" # (Optional) Authentication plugin. One of: mysql_native_password | caching_sha2_password | sha256_password | aad_auth. Default: server default
#     auth_string: null       # (Optional, sensitive) Already-hashed authentication string for auth_plugin (e.g. "*2470C0C06DEE42FD1618BB99005ADCA2EC9D1E19"). Alias of auth_string_hashed. Default: null
#     auth_string_hashed: null # (Optional, sensitive) Already-hashed authentication string; used only when auth_string is absent. Default: null
#     aad_identity:           # (Optional) Azure AD identity block. Only sent when auth_plugin is "aad_auth"; ignored otherwise
#       type: "user"          # (Optional) Identity type: user | group | service_principal. Default: provider default
#       identity: "app@contoso.com" # (Required when auth_plugin is "aad_auth") Azure AD user/group name or service principal object ID
#     max_user_connections: 0 # (Optional) Max simultaneous connections for the user, 0 = unlimited. Default: server default
#     max_statement_time: 0   # (Optional) Max statement execution time in seconds, 0 = unlimited. MariaDB 10.1.1+ only, not MySQL. Default: server default
#     resource_group: "user" # (Optional) Stable state group: owner | user. Default: derived from grant
#     manage_grants: true     # (Optional) Manage grants in this module. Default: true

# owner_users: independent owner-user map for state-compatible cloud wrappers.
# Keys may overlap with users because the resources occupy separate state maps.
owner_users: {}
#   app:
#     name: "appowner"        # (Required) MySQL owner user name
#     host: "%"               # (Optional) Host restriction. Default: "%"
#     password: null          # (Optional, sensitive) Externally managed password. Default: generated
#     generate_password: false # (Optional) Generate a password here. Default: true when password is omitted. Forced off when auth_plugin delegates authentication (auth_socket, authentication_kerberos/ldap_*/pam/webauthn/windows, mysql_no_login, gssapi, named_pipe, pam, unix_socket, aad_auth, AWSAuthenticationPlugin) or when auth_string is set
#     tls_option: "NONE"      # (Optional) MySQL TLS requirement. Default: provider default
#     auth_plugin: "caching_sha2_password" # (Optional) Authentication plugin. One of: mysql_native_password | caching_sha2_password | sha256_password | aad_auth. Default: server default
#     auth_string: null       # (Optional, sensitive) Already-hashed authentication string for auth_plugin (e.g. "*2470C0C06DEE42FD1618BB99005ADCA2EC9D1E19"). Alias of auth_string_hashed. Default: null
#     auth_string_hashed: null # (Optional, sensitive) Already-hashed authentication string; used only when auth_string is absent. Default: null
#     aad_identity:           # (Optional) Azure AD identity block. Only sent when auth_plugin is "aad_auth"; ignored otherwise
#       type: "user"          # (Optional) Identity type: user | group | service_principal. Default: provider default
#       identity: "app@contoso.com" # (Required when auth_plugin is "aad_auth") Azure AD user/group name or service principal object ID
#     max_user_connections: 0 # (Optional) Max simultaneous connections for the user, 0 = unlimited. Default: server default
#     max_statement_time: 0   # (Optional) Max statement execution time in seconds, 0 = unlimited. MariaDB 10.1.1+ only, not MySQL. Default: server default
#     databases: ["appdb"]   # (Optional) Databases to grant. Default: []
#     manage_grants: true     # (Optional) Manage grants in this module. Default: true

# password_rotation_period: (Optional) Number of days between automatic password rotations.
# Set to 0 to disable time-based rotation. Default: 0
password_rotation_period: 0

# force_reset: (Optional) Set to true to force password replacement on the next apply.
# Resets to false after the passwords have been rotated. Default: false
force_reset: false

# specials_in_password: (Optional) Use special characters (=_-+@~#) in generated owner/user
# passwords. Set to false for alphanumeric-only passwords when a client or connection string
# cannot carry specials. Default: true
specials_in_password: true
